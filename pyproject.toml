[project]
name = "nudge-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "sahadat-sk",email = "mss.21U10442@btech.nitdgp.ac.in"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.138.1,<0.139.0)",
    "uvicorn (>=0.49.0,<0.50.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "authlib (>=1.7.2,<2.0.0)",
    "python-jose (>=3.5.0,<4.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "pydantic[email] (>=2.13.4,<3.0.0)"
]

[tool.poetry]
packages = [{include = "nudge_backend", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
